<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atlas — Cockpit</title>
  <link rel="stylesheet" href="cockpit.css">
</head>
<body>
  <div id="app">

    <header>
      <div class="header-left">
        <div class="orb-dot"></div>
        <span class="brand">Atlas</span>
      </div>
      <div class="header-right">
        <span id="state-badge">IDLE</span>
        <button id="close-btn">✕</button>
      </div>
    </header>

    <div id="messages"></div>

    <div id="registration-card" class="registration-card hidden">
      <div class="reg-header">
        <span class="reg-badge">REGISTRO</span>
        <span class="reg-title">Activa Atlas en tu cuenta</span>
      </div>
      <div class="reg-body">
        <p class="reg-label">Código de dispositivo</p>
        <div class="reg-code-row">
          <code id="reg-device-code" class="reg-code"></code>
          <button id="reg-copy-btn" class="reg-copy-btn">copiar</button>
        </div>
        <p id="reg-expires" class="reg-expires"></p>
        <p id="reg-url-fallback" class="reg-url-fallback"></p>
      </div>
      <div class="reg-buttons">
        <button id="reg-open-btn" class="reg-open-btn">Abrir app.aigency.com</button>
      </div>
    </div>

    <div id="permission-card" class="hidden">
      <div class="perm-header">
        <span class="perm-badge" id="perm-badge">SENSITIVE</span>
        <span class="perm-title" id="perm-title">Acción requerida</span>
      </div>
      <div class="perm-body">
        <p class="perm-description" id="perm-description"></p>
        <p class="perm-warning" id="perm-warning"></p>
      </div>
      <div class="perm-buttons">
        <button class="perm-btn cancel" id="perm-cancel-btn">Cancelar</button>
        <button class="perm-btn approve" id="perm-approve-btn">Permitir</button>
        <button class="perm-btn close-only hidden" id="perm-close-btn">Cerrar</button>
      </div>
    </div>

    <div id="input-area">
      <textarea
        id="prompt-input"
        placeholder="Escribe a Atlas…"
        rows="1"
        maxlength="8000"
      ></textarea>
      <button id="send-btn" title="Enviar">↑</button>
    </div>

  </div>
  <script src="cockpit.js"></script>
</body>
</html>
