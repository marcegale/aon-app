<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atlas — Cockpit</title>
  <link rel="stylesheet" href="cockpit.css">
</head>
<body>
  <div id="app">

    <header>
      <div class="header-left">
        <div class="orb-dot"></div>
        <span class="brand">Atlas</span>
      </div>
      <div class="header-right">
        <span id="state-badge">IDLE</span>
        <button id="close-btn">✕</button>
      </div>
    </header>

    <div id="messages"></div>

    <div id="input-area">
      <textarea
        id="prompt-input"
        placeholder="Escribe a Atlas…"
        rows="1"
        maxlength="8000"
      ></textarea>
      <button id="send-btn" title="Enviar">↑</button>
    </div>

  </div>
  <script src="cockpit.js"></script>
</body>
</html>
